server:
  port: 8080

spring:
  application:
    name: novalearn-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      "[hibernate.format_sql]": true

  flyway:
    enabled: true
    locations: "classpath:db/migration"

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  certificates:
    verification-base-url: ${CERTIFICATE_VERIFICATION_BASE_URL:http://localhost:8080/api/v1/certificates/code}

  security:
    login-otp-enabled: ${LOGIN_OTP_ENABLED:false}
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES:15}
      refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS:7}

    refresh-cookie:
      name: novalearn_refresh_token
      path: /api/v1/auth
      same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
      secure: ${REFRESH_COOKIE_SECURE:false}

  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    first-name: ${ADMIN_FIRST_NAME}
    last-name: ${ADMIN_LAST_NAME}

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
    folder: ${CLOUDINARY_FOLDER:novalearn/courses}

  resend:
    api-key: ${RESEND_API_KEY}
    from-email: ${RESEND_FROM_EMAIL}

  culqi:
    api-base-url: ${CULQI_API_BASE_URL:https://api.culqi.com/v2}
    public-key: ${CULQI_PUBLIC_KEY:}
    secret-key: ${CULQI_SECRET_KEY:}
    phone-number: ${CULQI_PHONE_NUMBER:999999999}
    processing-fee-percentage: ${CULQI_PROCESSING_FEE_PERCENTAGE:0}
    processing-fee-tax-percentage: ${CULQI_PROCESSING_FEE_TAX_PERCENTAGE:18}
    pass-processing-fee-to-student: ${CULQI_PASS_PROCESSING_FEE_TO_STUDENT:true}
