server:
  port: 8080

spring:
  application:
    name: novalearn-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate.format_sql: true

  flyway:
    enabled: true
    locations: "classpath:db/migration"

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB  

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES}
      refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS}

    refresh-cookie:
      name: novalearn_refresh_token
      path: /api/v1/auth
      same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
      secure: ${REFRESH_COOKIE_SECURE:false}      

  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    first-name: ${ADMIN_FIRST_NAME}
    last-name: ${ADMIN_LAST_NAME}

  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME}
    api-key: ${CLOUDINARY_API_KEY}
    api-secret: ${CLOUDINARY_API_SECRET}
    folder: ${CLOUDINARY_FOLDER:novalearn/courses}

  resend:
    api-key: ${RESEND_API_KEY}
    from-email: ${RESEND_FROM_EMAIL}  

  culqi:
    api-base-url: ${CULQI_API_BASE_URL:https://api.culqi.com/v2}
    public-key: ${CULQI_PUBLIC_KEY:}
    secret-key: ${CULQI_SECRET_KEY:}
