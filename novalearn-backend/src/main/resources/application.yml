server:
  port: 8080

spring:
  application:
    name: novalearn-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/novalearn_db
    username: novalearn_user
    password: NovaLearn123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate.format_sql: true

  flyway:
    enabled: true
    locations: "classpath:db/migration"

app:
  security:
    jwt:
      secret: "NovaLearnSuperSecretKeyForJwtTokenGenerationMustBeLongEnough123456"
      access-token-expiration-minutes: 15
      refresh-token-expiration-days: 7