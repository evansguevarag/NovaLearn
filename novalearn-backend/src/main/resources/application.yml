server:
  port: 8080

spring:
  application:
    name: novalearn-backend

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate.format_sql: true

  flyway:
    enabled: true
    locations: "classpath:db/migration"

app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration-minutes: ${JWT_ACCESS_EXPIRATION_MINUTES}
      refresh-token-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS}

  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
    first-name: ${ADMIN_FIRST_NAME}
    last-name: ${ADMIN_LAST_NAME}